name: Deploy project folder from project-branch

on:
  push:
    branches:
      - search-plants   # 새 브랜치에 변경 생길 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v3
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout project-branch
        uses: actions/checkout@v3
        with:
          ref: search-plants
          path: search-plants

      - name: Copy project files into main/project
        run: |
          rm -rf project/*
          mkdir -p project
          cp -r search-plants/* project/

      - name: Commit and push changes to main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add project
          git commit -m "Update project from project-branch" || echo "No changes"
          git push origin main
