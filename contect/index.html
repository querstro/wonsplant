        .box > a{

        }

            justify-content: center;
            align-items: center;

            margin-top: 45px;
        }
        .minis > a {
            width: auto;
            height: 48px;
            padding-right: 10px;
            padding-left: 10px;

            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            white-space:pre-wrap;

            backdrop-filter: blur(35px);
            margin-bottom: 12px;
            font-size: 20px;
            font-weight: bold;
            color:#000000;
            display: flex;
            flex-direction: column;
        }
        i{
