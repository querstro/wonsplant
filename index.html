    <style>
        @import url('https://fonts.googleapis.com/css2?family=Joan&family=Noto+Serif+KR:wght@200..900&display=swap');

            font-family: "Noto Serif KR", serif;

        .joan-regular {
            font-family: "Joan", serif;
            font-weight: 400;
            font-style: normal;
            color: rgb(255, 255, 255);
            font-size: 11pt;
        }
        body{
            font-family: "Joan", "Noto Serif KR", serif;
            background-image: url('제주_고도정.jpg');
            background-position: center;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .pro {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(35px);
            width: 320px;
            height: 230px;
            border-radius: 8px;
            margin-bottom: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1{ 
            color: rgb(255, 255, 255);
            font-size: 50pt;
            display: flex;
            justify-content: center;
        }
        .bigbutton{
            width: 300px;
            height: 50px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(35px);
            margin-bottom: 12px;
            font-size: 17px;
            font-weight: bold;
            color:#000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }
        .bigs {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 0px;
            gap: 10px;
        }
        .bigs > a {
            width: 300px;
            background-color: white;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-decoration: none;
            padding: 20px 16px 16px 16px;
            border-radius: 8px;
        }
        .minis {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 0px;
            gap: 7px;
            margin-bottom: 45px;
        }
        .minis > a {
            width: 102px;
            height: 48px;
            border-radius: 32px;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            white-space:pre-wrap;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(35px);
            margin-bottom: 12px;
            font-size: 20px;
            font-weight: bold;
            color:#000000;
            display: flex;
            flex-direction: column;
        }
        .small{
            font-size: 11pt; 
            font-style: normal;
            font-weight: lighter;
        }
        i{
            size: 20pt;
            color: #ffffff;
        }
