<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5ZWPBDN7JM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-5ZWPBDN7JM');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="식물 백과사전">
    <meta property="og:description" content="알고싶은 식물을 검색해보세요.">
    <meta property="og:image" content=url("image.jpg")>
    <title>식물 검색사이트</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Joan&family=Noto+Serif+KR:wght@200..900&display=swap');
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: rgb(72, 110, 88);
            background-image: url('image.jpg');
            flex-direction: column;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="text"] {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }
        .box{
            background: rgba(255, 255, 255, 0.9);
            width: auto;
            height: auto;
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .noto-serif-kr {
            font-family: "Noto Serif KR", serif;
            font-weight: weight;
            font-style: normal;
        }
        h1{
            font-family: "Noto Serif KR", serif;
            font-weight: weight;
            font-style: normal;
            font-size: 45pt;
            color: rgb(255, 255, 255);
        }
        .joan-regular {
            font-family: "Joan", serif;
            font-weight: 400;
            font-style: normal;
            color: rgb(255, 255, 255);
            
        }
    </style>
</head>
<body>
    <h1>농작물과 공기정화식물을 검색해보세요</h1>
    <div class="box">
        <div class="noto-serif-kr">자료출처: 농촌진흥청</div>
        <form onsubmit="performSearch(); return false;"> 
            <input type="text" id="searchInput" placeholder="Enter search term">
            <button type="submit">검색</button>
        </form>
    </div>

    <script>
        // 검색 버튼을 누르면 실행되는 함수 (예시: performSearch)
    function performSearch() {
        const searchTerm = document.getElementById('searchInput').value;
        if (searchTerm) {
            const encodedTerm = encodeURIComponent(searchTerm);
            // 이 라인이 실행되어야 페이지가 이동합니다.
            window.location.href = `/search-plants/result-plants/?query=${encodedTerm}`;
        } else {
            console.log("D. 검색어가 입력되지 않음");
            alert("검색어를 입력해 주세요.");
        }
    }

    </script>
</body>
</html>
